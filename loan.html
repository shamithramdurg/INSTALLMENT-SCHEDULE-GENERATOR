<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Loan Details</title>

    <link rel="stylesheet" href="css/style.css">

</head>

<body data-protected="true">

<header class="navbar">

    <div class="logo">
        Installment Generator
    </div>

    <nav>
        <a href="dashboard.html">Dashboard</a>
        <span class="nav-user" id="userName"></span>
        <a href="#" data-logout>Logout</a>
    </nav>

</header>

<div class="form-container">

    <div class="form-box">

        <h1>Enter Loan Details</h1>

        <p id="loanMessage" class="msg" role="alert" hidden></p>

        <form id="loanForm">

            <label for="principal">
                Principal Amount
            </label>

            <input
                type="number"
                id="principal"
                min="100"
                max="1000000000"
                step="0.01"
                placeholder="Enter loan amount"
                required
            >

            <label for="interest">
                Annual Interest Rate (%)
            </label>

            <input
                type="number"
                id="interest"
                min="0"
                max="100"
                step="0.01"
                placeholder="Enter interest rate"
                required
            >

            <label for="tenure">
                Loan Tenure (Months)
            </label>

            <input
                type="number"
                id="tenure"
                min="1"
                max="600"
                step="1"
                placeholder="Enter tenure"
                required
            >

            <label for="frequency">
                Installment Frequency
            </label>

            <select id="frequency" required>

                <option value="">
                    Select Frequency
                </option>

                <option value="monthly">
                    Monthly
                </option>

                <option value="weekly">
                    Weekly
                </option>

                <option value="quarterly">
                    Quarterly
                </option>

                <option value="yearly">
                    Yearly
                </option>

            </select>

            <small id="frequencyHint" class="hint"></small>

            <label for="startDate">
                Starting Date
            </label>

            <input
                type="date"
                id="startDate"
                required
            >

            <button type="submit" class="btn">
                Generate Schedule
            </button>

        </form>

    </div>

</div>

<footer>
    <p>© 2026 Installment Schedule Generator</p>
</footer>

<script src="js/api-config.js"></script>
    <script src="js/main.js"></script>
<script src="js/loan.js"></script>

</body>
</html>
