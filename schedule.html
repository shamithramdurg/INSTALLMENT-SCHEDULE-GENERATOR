<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Installment Schedule</title>

    <link rel="stylesheet" href="css/style.css">

</head>

<body data-protected="true">

<header class="navbar">

    <div class="logo">
        Installment Generator
    </div>

    <nav>
        <a href="dashboard.html">Dashboard</a>
        <a href="loan.html">New Schedule</a>
        <span class="nav-user" id="userName"></span>
        <button type="button" data-print class="print-btn">
            Print
        </button>
        <a href="#" data-logout>Logout</a>
    </nav>

</header>

<section class="schedule-container">

    <h1>Installment Schedule</h1>

    <p id="pageMessage" class="msg" role="alert" hidden></p>

    <div class="toolbar">
        <a class="btn-small" href="report.html" data-report-link>Printable Report</a>
        <button type="button" class="btn-small" data-download-csv>Download CSV</button>
        <a class="btn-small" href="dashboard.html#saved">All Saved Schedules</a>
    </div>

    <div id="summary" class="summary"></div>

    <div class="table-container">

        <table>

            <thead>

                <tr>
                    <th>No.</th>
                    <th>Due Date</th>
                    <th>Installment</th>
                    <th>Principal</th>
                    <th>Interest</th>
                    <th>Balance</th>
                </tr>

            </thead>

            <tbody id="scheduleBody">

            </tbody>

            <tfoot id="scheduleFoot"></tfoot>

        </table>

    </div>

</section>

<script src="js/api-config.js"></script>
    <script src="js/main.js"></script>
<script src="js/schedule.js"></script>

</body>
</html>
